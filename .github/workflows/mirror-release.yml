name: Mirror upstream release assets

# 把上游仓库某个 Release 的全部资产复制到本仓库同名 Release。
# 运行在 GitHub 自己的 runner 上，资产在 GitHub 内网之间传输，不受本地出口带宽限制。

on:
  workflow_dispatch:
    inputs:
      upstream:
        description: "上游仓库，如 HRuiCcc/RuiC-oc-ferry"
        required: true
        type: string
      tag:
        description: "Release tag，如 v0.4.0"
        required: true
        type: string
      upload_ip:
        description: "保留字段，无实际作用"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fetch release metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM: ${{ inputs.upstream }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${UPSTREAM}/releases/tags/${TAG}" \
            -o release.json
          python3 - <<'PY'
          import json, pathlib
          d = json.load(open("release.json"))
          names = [a["name"] for a in d.get("assets", [])]
          pathlib.Path("assets.txt").write_text("\n".join(names) + "\n")
          print("assets:", len(names))
          for n in names:
              print("  -", n)
          PY

      - name: Download assets from upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM: ${{ inputs.upstream }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            echo "downloading $name"
            curl -fsSL --retry 5 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/${UPSTREAM}/releases/tags/${TAG}" > /dev/null 2>&1 || true
            gh release download "$TAG" --repo "$UPSTREAM" --pattern "$name" --dir . --clobber
            ls -l "$name"
          done < ../assets.txt
          echo "--- sha256 ---"
          sha256sum * || true

      - name: Publish to this repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          tag = os.environ["TAG"]
          meta = json.load(open("release.json"))
          # 如果本仓库还没有该 release，先建一个
          r = subprocess.run(
              ["gh", "release", "view", tag, "--json", "tagName"],
              capture_output=True, text=True)
          if r.returncode != 0:
              body = (meta.get("body") or "")[:60000]
              subprocess.run(
                  ["gh", "release", "create", tag,
                   "--title", meta.get("name") or tag,
                   "--notes", body or f"Mirror of {meta.get('tag_name')}",
                  ],
                  check=True)
              print("created release", tag)
          else:
              print("release exists", tag)
          PY
          for f in dist/*; do
            echo "uploading $f"
            gh release upload "$TAG" "$f" --clobber
          done

      - name: Verify uploaded assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "\(.name)\t\(.size)\t\(.digest // "no-digest")"' | tee out.txt
          echo "--- local vs remote size check ---"
          python3 - <<'PY'
          import json, os, subprocess
          tag = os.environ["TAG"]
          remote = json.loads(subprocess.run(
              ["gh", "release", "view", tag, "--json", "assets"],
              capture_output=True, text=True, check=True).stdout)["assets"]
          rmap = {a["name"]: a["size"] for a in remote}
          ok = True
          for f in sorted(os.listdir("dist")):
              size = os.path.getsize(os.path.join("dist", f))
              got = rmap.get(f)
              status = "OK" if got == size else "MISMATCH"
              if got != size:
                  ok = False
              print(f"  {f}: local={size} remote={got} {status}")
          if not ok:
              raise SystemExit("size mismatch detected")
          print("all assets verified")
          PY